 <!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Кофейня</title>

  <style>
    body {
      margin: 0;
      font-family: Arial;
     background: url('https://images.unsplash.com/photo-1509042239860-f550ce710b93') no-repeat center/cover;
      color: white;
      text-align: center;
    }

    .container {
      padding: 100px 20px;
    }

    h1 {
      font-size: 48px;
      margin-bottom: 10px;
    }

    p {
      font-size: 18px;
      opacity: 0.8;
    }

    button {
      margin-top: 20px;
      padding: 15px 30px;
      font-size: 18px;
      background: orange;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background: #ff9800;
      transform: scale(1.05);
    }

    .section {
      padding: 60px 20px;
    }

    .cards {
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    .card {
      background: #222;
      padding: 20px;
      border-radius: 15px;
      width: 200px;
      transition: 0.3s;
    }

    .card:hover {
      transform: translateY(-10px);
    }
.overlay {
  position: fixed;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.6);
  top: 0;
  left: 0;
  z-index: -1;
}
  </style>
</head>

<body>
<div class="overlay"></div>
<div class="container">
  <h1>Лучшая кофейня ☕</h1>
  <p>Свежий кофе каждый день</p>

  <a href="https://t.me/@yrSsof" target="_blank">
    <button>Заказать кофе</button>
  </a>
</div>

<div class="section">
  <h2>Наше меню</h2>

  <div class="cards">
    <div class="card">
      <h3>Эспрессо</h3>
      <p>Крепкий и бодрящий</p>
    </div>

    <div class="card">
      <h3>Капучино</h3>
      <p>Нежная пенка</p>
    </div>

    <div class="card">
      <h3>Латте</h3>
      <p>Мягкий вкус</p>
    </div>
  </div>
</div>

<div class="section">
  <h2>О нас</h2>
  <p>Мы готовим лучший кофе в городе и делаем людей счастливее ❤️</p>
</div>

</body>
</html>
