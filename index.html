 <!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Кофейня</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

   body {
  background: url('https://images.unsplash.com/photo-1509042239860-f550ce710b93') center/cover no-repeat;
  color: white;
  text-align: center;
  position: relative;
}

body::before {
  content: "";
  position: fixed;   /* ВАЖНО */
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.6);
  top: 0;
  left: 0;
  z-index: 0;
}

.container, .section {
  position: relative;
  z-index: 1;
}

    .container {
      padding: 100px 20px;
      animation: fadeIn 1.5s ease;
    }

    h1 {
      font-size: 42px;
      margin-bottom: 10px;
    }

    p {
      font-size: 18px;
      margin-bottom: 25px;
      color: #ddd;
    }

    button {
      background: linear-gradient(45deg, #ff9800, #ffcc00);
      border: none;
      padding: 15px 35px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      transform: scale(1.1);
      box-shadow: 0 10px 30px rgba(255,165,0,0.6);
    }

    .section {
      padding: 50px 20px;
    }

    .menu {
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
      margin-top: 30px;
    }

    .card {
      background: #2c2c2c;
      padding: 20px;
      border-radius: 15px;
      width: 200px;
      transition: 0.3s;
    }

    .card:hover {
      transform: translateY(-10px);
      background: #3a3a3a;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
.menu {
  display: flex;
  justify-content: center;
  gap: 20px;
  flex-wrap: wrap;
}

.card {
  background: #fff;
  border-radius: 14px;
  padding: 20px;
  width: 160px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.1);
  transition: 0.3s;
}

.card:hover {
  transform: translateY(-8px);
  box-shadow: 0 20px 40px rgba(0,0,0,0.15);
}
  </style>
</head>

<body>

  <div class="container">
    <h1>Лучшая кофейня ☕</h1>
    <p>Авторский кофе с доставкой за 15 минут</p>

    <a href="https://t.me/yrSsof" target="_blank">
      <button>Заказать кофе</button>
    </a>
  </div>

 <div class="section">
  <h2>Наше меню</h2>
<div class="menu">
  <div class="menu">
    <div class="card">
      <h3>Эспрессо</h3>
      <p>Крепкий и бодрящий</p>
    </div>

    <div class="card">
      <h3>Капучино</h3>
      <p>Нежная пенка</p>
    </div>

    <div class="card">
      <h3>Латте</h3>
      <p>Мягкий вкус</p>
    </div>
  </div>
</div>
